<!doctype html>
<html lang="{{ site.lang | default: 'en' }}" data-theme="light" data-palette="forest">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <meta name="theme-color" content="#f5f8f6">
    <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <script>
      (function () {
        var savedTheme;
        var savedPalette;
        try {
          savedTheme = localStorage.getItem("theme");
          savedPalette = localStorage.getItem("palette");
        } catch (error) {}
        var theme = savedTheme === "light" || savedTheme === "dark"
          ? savedTheme
          : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.palette = ["cobalt", "forest", "plum"].indexOf(savedPalette) !== -1 ? savedPalette : "forest";
      }());
    </script>
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
    {% if page.map %}
      <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin="">
      <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""
        defer></script>
      <script
        src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"
        defer></script>
      <script src="{{ '/assets/js/travel-map.js' | relative_url }}" defer></script>
    {% endif %}
    <script src="{{ '/assets/js/theme.js' | relative_url }}" defer></script>
  </head>
  <body{% if page.layout == 'detail' %} class="detail-page"{% endif %}>
    <a class="skip-link" href="#main-content">Skip to content</a>
    {% include theme-toggle.html %}
    <div class="site-shell">
      {% include sidebar.html %}
      <main id="main-content" class="site-main">
        {{ content }}
      </main>
    </div>
  </body>
</html>
