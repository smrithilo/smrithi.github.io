<!doctype html>
<html lang="{{ site.lang | default: 'en' }}" data-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <meta name="theme-color" content="#f4f0e7">
    <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <script>
      (function () {
        var saved;
        try { saved = localStorage.getItem("theme"); } catch (error) {}
        var theme = saved === "light" || saved === "dark"
          ? saved
          : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.dataset.theme = theme;
      }());
    </script>
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
    <script src="{{ '/assets/js/theme.js' | relative_url }}" defer></script>
  </head>
  <body{% if page.layout == 'detail' %} class="detail-page"{% endif %}>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <div class="site-shell">
      {% include sidebar.html %}
      <main id="main-content" class="site-main">
        {{ content }}
      </main>
    </div>
  </body>
</html>
