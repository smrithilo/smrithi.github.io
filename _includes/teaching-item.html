{% assign item = include.item %}
<article class="teaching-item">
  <div>
    <h3>{{ item.role }}</h3>
    <p>
      {% if item.organization_url and item.organization_url != "" %}
        <a href="{{ item.organization_url }}">{{ item.organization }}</a>
      {% else %}
        {{ item.organization }}
      {% endif %}
    </p>
  </div>
  <p class="teaching-item__date">{{ item.dates }}</p>
  {% if item.summary and item.summary != "" %}<p class="teaching-item__summary">{{ item.summary }}</p>{% endif %}
</article>
